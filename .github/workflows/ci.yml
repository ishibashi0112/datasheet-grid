name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          # package.json の packageManager(pnpm@11.12.0)と揃える(devEngines は 2026-07-18 に削除済み)
          version: 11.12.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck (src + tests, strict)
        run: |
          pnpm exec tsc -b --force
          pnpm run typecheck:test

      - name: Test
        run: pnpm test

      # 追加(Solid 版 段階 3-1): Solid 版(packages/solid。まだ公開していない)の型チェックとテスト。ルートの tsc / vitest の
      #   対象外なので別に回す。React 版と並べて同じ props・同じ操作で DOM と通知を比べるテスト(src/parity)を含む。
      #   test:ssr はサーバーで描いた HTML のハイドレーションの確かめ(packages/solid/ssr。段階 4 の測り直し)。
      - name: Solid (typecheck + test)
        run: |
          pnpm --filter ./packages/solid run typecheck
          pnpm --filter ./packages/solid test
          pnpm --filter ./packages/solid run test:ssr

      - name: Build library
        run: pnpm run build:lib

      # 追加(差し込み式 段階 1): 利用側で組み込んだときの初期 JS(gzip)が scripts/size-budget.json の上限を超えたら落とす。
      - name: Bundle size budget
        run: pnpm run size:check

      # 追加(広報 2): examples/*(StackBlitz で開くサンプル)を今のコード(pack した tarball)で型チェック + ビルドする。
      - name: Check examples
        run: pnpm run examples:check

      # 追加(1.0 の準備): 公開型の型テスト。pack した d.ts を利用側の形で TypeScript の下限 / リポジトリの版 / 最新と
      #   React 18 / 19 の型で tsc にかけ、d.ts を出すライブラリの形で core の内部のパスを指さないかも確かめる。
      - name: Check public types
        run: pnpm run types:check

      # 追加(audit P-6): CLAUDE.md のゲート表にあるデモ app のビルドも CI で確認する(website は対象外)。
      - name: Build demo app
        run: pnpm exec vp build

      - name: Lint
        run: pnpm lint

  # 追加(Solid 版の測り直し 段階 4 1-4): Solid 版を Solid の最新の 2.x でも回す。上の ci のジョブはロックファイルの版
  #   (Solid 2.0.0 = Solid 版が対応する下限)で回すので、こちらは solid-js / @solidjs/web / @solidjs/signals と、利用側の
  #   JSX を変換するコンパイラ(@solidjs/compiler / @solidjs/babel-plugin)を 2.x の最新へ上げてから同じ確かめをする
  #   (scripts/solid-latest.mjs。公開から 2 日たった版)。
  solid-latest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.12.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Solid を最新の 2.x へ上げる
        run: node scripts/solid-latest.mjs

      - name: Solid (typecheck + test + test:ssr)
        run: |
          pnpm --filter ./packages/solid run typecheck
          pnpm --filter ./packages/solid test
          pnpm --filter ./packages/solid run test:ssr
