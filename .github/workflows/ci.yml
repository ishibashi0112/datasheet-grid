name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          # package.json の packageManager(pnpm@11.12.0)と揃える(devEngines は 2026-07-18 に削除済み)
          version: 11.12.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck (src + tests, strict)
        run: |
          pnpm exec tsc -b --force
          pnpm run typecheck:test

      - name: Test
        run: pnpm test

      - name: Build library
        run: pnpm run build:lib

      # 追加(差し込み式 段階 1): 利用側で組み込んだときの初期 JS(gzip)が scripts/size-budget.json の上限を超えたら落とす。
      - name: Bundle size budget
        run: pnpm run size:check

      # 追加(audit P-6): CLAUDE.md のゲート表にあるデモ app のビルドも CI で確認する(website は対象外)。
      - name: Build demo app
        run: pnpm exec vp build

      - name: Lint
        run: pnpm lint
